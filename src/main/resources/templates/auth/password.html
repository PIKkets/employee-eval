<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head('비밀번호 변경 - DFOCUS 평가 시스템')}"></th:block>
</head>
<body class="bg-light">
    
    <div class="d-flex wrapper">
        <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

        <div class="main-content flex-grow-1">
            <th:block th:replace="~{fragments/header :: header}"></th:block>
            
            <main class="content-area p-4">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5 text-center mb-4 mt-3">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2">비밀번호 변경</h3>
                        <p class="text-muted small">계정의 보안을 위해 비밀번호를 주기적으로 변경해주세요.</p>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div th:if="${success}" class="alert alert-success rounded-3 small text-center mb-4">
                            <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger rounded-3 small text-center mb-4">
                            <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${error}"></span>
                        </div>

                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <form th:action="@{/profile/password}" method="post">
                                <div class="mb-4">
                                    <label class="form-label text-muted fw-semibold small">현재 비밀번호</label>
                                    <input type="password" name="currentPassword" class="form-control" required placeholder="현재 비밀번호 입력">
                                </div>
                                <hr class="text-muted opacity-25">
                                <div class="mb-3">
                                    <label class="form-label text-muted fw-semibold small">새 비밀번호</label>
                                    <input type="password" name="newPassword" class="form-control" required placeholder="새로운 비밀번호 입력">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted fw-semibold small">새 비밀번호 확인</label>
                                    <input type="password" name="confirmPassword" class="form-control" required placeholder="새로운 비밀번호 재입력">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-3">변경하기</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
