<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 사원 평가 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f6f9 0%, #e2e8f0 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
        }
        .form-control {
            border-radius: 12px;
            padding: 0.8rem 1rem;
            background-color: #f8f9fa;
        }
        .form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.15);
            border-color: #4361ee;
        }
        .btn-primary {
            background-color: #4361ee;
            border-color: #4361ee;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <img th:src="@{/images/dfocus-logo.png}" alt="DFOCUS" style="height: 48px; object-fit: contain; margin-bottom: 0.5rem;">
            <h3 class="fw-bold mt-2">평가 시스템</h3>
            <p class="text-muted small">사번과 비밀번호를 입력하여 로그인하세요.</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger rounded-3 small text-center" th:text="${param.exception != null ? param.exception : '아이디 또는 비밀번호가 일치하지 않습니다.'}">
        </div>
        <div th:if="${param.logout}" class="alert alert-info rounded-3 small">
            성공적으로 로그아웃 되었습니다.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label text-muted fw-semibold small">사번 (Login ID)</label>
                <input type="text" name="username" class="form-control" required placeholder="예: admin, emp001">
            </div>
            <div class="mb-4">
                <label class="form-label text-muted fw-semibold small">비밀번호</label>
                <input type="password" name="password" class="form-control" required placeholder="비밀번호를 입력하세요">
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">
                        로그인 상태 유지
                    </label>
                </div>
                <a href="#" data-bs-toggle="modal" data-bs-target="#resetPasswordModal" class="text-decoration-none small text-primary fw-medium">비밀번호 찾기</a>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>

        <div class="text-center mt-4 text-muted" style="font-size: 0.8rem;">
            &copy; 2026 DFOCUS Corp. All Rights Reserved.
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-labelledby="resetPasswordModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold" id="resetPasswordModalLabel">비밀번호 찾기</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center py-4">
            <i class="bi bi-shield-lock text-primary mb-3" style="font-size: 3rem;"></i>
            <p class="mb-1 fw-medium text-dark">비밀번호가 기억나지 않으시나요?</p>
            <p class="text-muted small mb-0">비밀번호 초기화 및 계정 잠금 해제는<br>인사팀(<a href="mailto:admin@dfocus.com" class="text-decoration-none">admin@dfocus.com</a>)으로 문의 바랍니다.</p>
          </div>
          <div class="modal-footer border-0 pt-0 justify-content-center">
            <button type="button" class="btn btn-light rounded-3 px-4" data-bs-dismiss="modal">확인</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
