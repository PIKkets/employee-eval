<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <header th:fragment="header" class="glass-header d-flex justify-content-between align-items-center px-4 py-3 shadow-sm rounded-bottom-4 mb-4 mx-4 mt-2">
        <h4 class="mb-0 fw-semibold text-primary">사원 평가 시스템</h4>
        <div class="user-profile d-flex align-items-center gap-3">
            <div class="text-end" th:if="${#authorization.expression('isAuthenticated()')}">
                <div class="fw-bold fs-6" th:text="${#authentication.principal.employee.name} + '님'">관리자님</div>
                <small class="text-muted" th:text="${#authentication.principal.employee.departmentName}">인사팀</small>
            </div>
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="bi bi-person-fill"></i>
            </div>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">로그아웃</button>
            </form>
        </div>
    </header>
</body>
</html>
