<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head('사원 관리 - 사원 평가 시스템')}"></th:block>
</head>
<body class="bg-light">
    
    <div class="d-flex wrapper">
        <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

        <div class="main-content flex-grow-1">
            <th:block th:replace="~{fragments/header :: header}"></th:block>
            
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">사원 관리</h2>
                    <button class="btn btn-primary rounded-pill shadow-sm px-4" data-bs-toggle="modal" data-bs-target="#addEmployeeModal"><i class="bi bi-person-plus me-1"></i> 사원 등록</button>
                </div>

                <div class="card p-0 shadow-sm border-0 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">이름</th>
                                    <th>부서</th>
                                    <th>사번 (ID)</th>
                                    <th>직급</th>
                                    <th>이메일</th>
                                    <th>권한</th>
                                    <th class="text-end pe-4">관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="emp : ${employees}">
                                    <td class="ps-4 fw-bold text-dark" th:text="${emp.name}">홍길동</td>
                                    <td><span class="badge bg-secondary" th:text="${emp.departmentName}">기획팀</span></td>
                                    <td th:text="${emp.loginId}">emp001</td>
                                    <td th:text="${emp.position}">대리</td>
                                    <td th:text="${emp.email}">hong@eval.com</td>
                                    <td>
                                        <span class="badge" th:classappend="${emp.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'" th:text="${emp.role}">USER</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <form th:action="@{/admin/employees/reset}" method="post" class="d-inline">
                                            <input type="hidden" name="id" th:value="${emp.id}"/>
                                            <button type="submit" class="btn btn-sm btn-outline-secondary shadow-sm me-1" title="비밀번호 초기화 및 잠금 해제"><i class="bi bi-unlock"></i></button>
                                        </form>
                                        <form th:action="@{/admin/employees/delete}" method="post" class="d-inline">
                                            <input type="hidden" name="id" th:value="${emp.id}"/>
                                            <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm" title="사원 삭제" onclick="return confirm('사원을 삭제하시겠습니까?');"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal fade" id="addEmployeeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">신규 사원 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/employees/add}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">이름</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">사번 (로그인 ID)</label>
                            <input type="text" name="loginId" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">부서</label>
                            <select name="departmentId" class="form-select" required>
                                <option value="">부서를 선택하세요</option>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">직급</label>
                            <input type="text" name="position" class="form-control" placeholder="예: 팀장, 과장, 대리" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">전자우편 (Email)</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">권한</label>
                            <select name="role" class="form-select">
                                <option value="USER">USER (일반 사원/평가자)</option>
                                <option value="ADMIN">ADMIN (관리자)</option>
                            </select>
                        </div>
                        <small class="text-muted"><i class="bi bi-info-circle"></i> 초기 비밀번호는 1234 로 설정됩니다.</small>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary fw-bold shadow-sm px-4">등록하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
