<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/base :: head('평가요소 관리 - 사원 평가 시스템')}"></th:block>
</head>
<body class="bg-light">
    
    <div class="d-flex wrapper">
        <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

        <div class="main-content flex-grow-1">
            <th:block th:replace="~{fragments/header :: header}"></th:block>
            
            <main class="content-area p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">평가요소 관리</h2>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-12">
                        <div class="card p-4 shadow-sm border-0 border-top border-warning border-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-percent me-2"></i>최종 등급 산출용 평가 유형별 가중치</h5>
                            <div class="row g-3">
                                <div class="col-md-3" th:each="tw : ${weights}">
                                    <form th:action="@{/admin/elements/weight/update}" method="post" class="d-flex align-items-center">
                                        <input type="hidden" name="evalType" th:value="${tw.evalType}">
                                        <div class="input-group input-group-sm shadow-sm">
                                            <span class="input-group-text fw-bold text-dark" style="width: 120px;" th:text="${tw.evalType}">PERFORMANCE</span>
                                            <input type="number" name="weight" class="form-control text-center" th:value="${tw.weight}" min="0" max="100" required>
                                            <span class="input-group-text">%</span>
                                            <button class="btn btn-outline-primary fw-bold" type="submit">저장</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Elements List -->
                    <div class="col-md-8">
                        <div class="card p-4 shadow-sm border-0">
                            <h5 class="fw-bold mb-3"><i class="bi bi-list-check me-2"></i>등록된 평가 기준(문항)</h5>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>유형</th>
                                            <th>요소명 (지표)</th>
                                            <th>가중치 (%)</th>
                                            <th class="text-end">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="el : ${elements}">
                                            <td>
                                                <span class="badge" th:classappend="${el.evalType == 'PERFORMANCE'} ? 'bg-primary' : (${el.evalType == 'COMPETENCY'} ? 'bg-success' : 'bg-warning')" th:text="${el.evalType}">PERFORMANCE</span>
                                            </td>
                                            <td class="fw-bold text-dark" th:text="${el.name}">목표 달성도</td>
                                            <td th:text="${el.weight + '%'}">40%</td>
                                            <td class="text-end">
                                                <form th:action="@{/admin/elements/delete}" method="post" class="d-inline">
                                                    <input type="hidden" name="id" th:value="${el.id}"/>
                                                    <button class="btn btn-sm btn-outline-danger shadow-sm"><i class="bi bi-trash"></i></button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Add Element -->
                    <div class="col-md-4">
                        <div class="card p-4 shadow-sm border-0 border-top border-primary border-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-plus-circle me-2"></i>평가요소 추가</h5>
                            <form th:action="@{/admin/elements/add}" method="post">
                                <div class="mb-3">
                                    <label class="form-label text-muted fw-semibold">평가 유형</label>
                                    <select name="evalType" class="form-select" required>
                                        <option value="PERFORMANCE">성과 평가 (PERFORMANCE)</option>
                                        <option value="COMPETENCY">역량 평가 (COMPETENCY)</option>
                                        <option value="PEER">다면 평가 (PEER)</option>
                                        <option value="INTERVIEW">면담 평가 (INTERVIEW)</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted fw-semibold">평가요소명</label>
                                    <input type="text" name="name" class="form-control" required placeholder="예: 의사소통 및 협업">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted fw-semibold">가중치 (%)</label>
                                    <input type="number" name="weight" class="form-control" min="1" max="100" required placeholder="30">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 shadow-sm fw-bold">추가하기</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <th:block th:replace="~{layout/base :: scripts}"></th:block>
</body>
</html>
