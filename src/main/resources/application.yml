spring:
  application:
    name: employee-eval
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/eval_db;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: never
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  mvc:
    hiddenmethod:
      filter:
        enabled: true
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.evaluation.employee_eval.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
